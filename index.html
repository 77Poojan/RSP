<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fist · Paper · Shears</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <header class="masthead">
      <p class="kicker">Best of five · first to three</p>
      <h1>Fist · Paper · Shears</h1>
    </header>

    <section class="scoreboard" aria-label="Match score">
      <div class="score-pill you">
        <span class="score-label">You</span>
        <span class="score-value" id="player-score">0</span>
      </div>
      <div class="round-chip">
        <span id="round-label">Round 1</span>
      </div>
      <div class="score-pill cpu">
        <span class="score-label">House</span>
        <span class="score-value" id="cpu-score">0</span>
      </div>
    </section>

    <section class="arena" aria-live="polite">
      <article class="fighter player">
        <p class="fighter-name">You</p>
        <div class="hand-well" id="player-hand">
          <svg class="glyph waiting" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="8 10" />
          </svg>
        </div>
      </article>

      <p class="vs" id="banner">Pick a move</p>

      <article class="fighter cpu">
        <p class="fighter-name">House</p>
        <div class="hand-well" id="cpu-hand">
          <svg class="glyph waiting" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="8 10" />
          </svg>
        </div>
      </article>
    </section>

    <p class="status" id="status">Rock crushes scissors. Paper wraps rock. Scissors slice paper.</p>

    <div class="moves" role="group" aria-label="Choose your move">
      <button class="move" data-move="rock" aria-keyshortcuts="1">
        <span class="move-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path fill="currentColor" d="M20 34c0-8 4-18 12-18s12 10 12 18v10c0 6-4 10-12 10s-12-4-12-10V34zm-6 2c-3 0-6 3-6 7v4c0 8 6 13 16 13h16c10 0 16-5 16-13v-6c0-4-3-7-6-7" opacity=".15"/>
            <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M22 30v-7a6 6 0 0 1 12 0v7M34 29v-9a6 6 0 0 1 12 0v11M18 32v-4a5 5 0 0 1 10 0v6M44 34v-3a5 5 0 0 1 9 2v9c0 8-6 14-16 14H27c-9 0-15-5-15-13v-6c0-3 2-6 6-6"/>
          </svg>
        </span>
        <span class="move-name">Fist</span>
        <span class="hotkey">1</span>
      </button>

      <button class="move" data-move="paper" aria-keyshortcuts="2">
        <span class="move-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path fill="currentColor" d="M18 14h22l10 10v28H18z" opacity=".15"/>
            <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M22 12h18l12 12v28a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4zM40 12v12h12M26 32h16M26 40h12"/>
          </svg>
        </span>
        <span class="move-name">Paper</span>
        <span class="hotkey">2</span>
      </button>

      <button class="move" data-move="scissors" aria-keyshortcuts="3">
        <span class="move-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="20" cy="44" r="8" fill="currentColor" opacity=".15"/>
            <circle cx="44" cy="44" r="8" fill="currentColor" opacity=".15"/>
            <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M20 44a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm24 0a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM25 33l19-19M39 33L20 14"/>
          </svg>
        </span>
        <span class="move-name">Shears</span>
        <span class="hotkey">3</span>
      </button>
    </div>

    <button class="reset" type="button" id="reset">New match</button>
  </main>

  <script src="game.js"></script>
</body>
</html>
